<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Thumbnail Downloader</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #fff;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 20px;
      opacity: 0.9;
    }
    .card {
      background: #fff;
      color: #333;
      padding: 20px;
      border-radius: 15px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.3);
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }
    input {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ff416c;
      border-radius: 8px;
      outline: none;
      margin-bottom: 15px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      background: #ff416c;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #ff2e63;
    }
    .thumbnail img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.25);
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .download-btn:hover {
      background: #218838;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .size-buttons {
      margin-top: 15px;
    }
    .size-buttons button {
      margin: 5px;
      background: #007bff;
    }
    .size-buttons button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>🎥 YouTube Thumbnail Downloader</h1>
  <p>Paste a YouTube link to view and download its thumbnail in different sizes.</p>

  <div class="card">
    <input type="text" id="youtubeLink" placeholder="👉 Paste YouTube video link here">
    <br>
    <button onclick="getThumbnail()">Get Thumbnail</button>
    
    <div class="thumbnail" id="thumbnail"></div>
  </div>

  <script>
    function getThumbnail() {
      const url = document.getElementById("youtubeLink").value.trim();
      const videoId = extractVideoId(url);

      if (!videoId) {
        alert("⚠️ Please enter a valid YouTube link!");
        return;
      }

      const sizes = {
        "Max Resolution": `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
        "High Quality": `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
        "Medium Quality": `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
        "Default": `https://img.youtube.com/vi/${videoId}/default.jpg`
      };

      let html = "";
      for (let size in sizes) {
        html += `
          <div>
            <h3>${size}</h3>
            <img src="${sizes[size]}" alt="Thumbnail - ${size}">
            <br>
            <button class="download-btn" onclick="downloadImage('${sizes[size]}','${videoId}-${size.replace(/ /g,'_')}.jpg')">⬇ Download</button>
          </div>
          <hr>
        `;
      }

      document.getElementById("thumbnail").innerHTML = html;
    }

    function extractVideoId(url) {
      const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:.*v=|embed\/)|youtu\.be\/)([^&\n?#]+)/;
      const match = url.match(regex);
      return match ? match[1] : null;
    }

    async function downloadImage(imageUrl, fileName) {
      try {
        const response = await fetch(imageUrl);
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        alert("❌ Failed to download image.");
      }
    }
  </script>
</body>
</html>
